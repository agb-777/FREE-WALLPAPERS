<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Wallpaper desktop resolusi tinggi, gratis diunduh.">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="color-scheme" content="dark">
  <title>FREE-WALLPAPERS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%BC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <h1 class="site-title"><a href="#/">FREE-WALLPAPERS</a></h1>
      <p class="count" id="count"></p>
    </div>
  </header>

  <main class="wrap">
    <div class="grid" id="grid"></div>
    <nav class="pager" id="pager" aria-label="Halaman"></nav>
  </main>

  <footer class="site-footer">Copyright © <span id="year"></span> agb-777</footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Detail wallpaper" hidden>
    <div class="lightbox__bar">
      <a class="btn btn--primary" id="download" target="_blank" rel="noopener">Download</a>
      <button class="btn" id="close" type="button">Tutup</button>
    </div>
    <div class="lightbox__stage" id="stage">
      <button class="lightbox__nav lightbox__nav--prev" id="prev" type="button" aria-label="Sebelumnya">‹</button>
      <div class="lightbox__frame"><img class="fade" id="image" alt="Wallpaper"></div>
      <button class="lightbox__nav lightbox__nav--next" id="next" type="button" aria-label="Berikutnya">›</button>
    </div>
  </div>

  <noscript><p class="notice">Aktifkan JavaScript untuk melihat wallpaper.</p></noscript>
  <script src="app.js" defer></script>
</body>
</html>
